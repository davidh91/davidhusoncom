<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <!--
      Security headers. This site is served as static files (GitHub Pages), so
      it cannot set real HTTP response headers. These meta equivalents are the
      next best thing.

      The Content-Security-Policy allow-list covers exactly what the site uses:
        - Google Fonts stylesheets and font files
        - reCAPTCHA v2 (script, iframe and images)
        - the EmailJS send endpoint (contact form)
      'unsafe-inline' is required for style-src only, because Framer Motion and
      reCAPTCHA both set inline styles. Scripts need no inline allowance: the
      Vite build emits only external module scripts. The dev server needs
      inline scripts, so vite.config.js removes this policy in dev only.
    -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self';
      script-src 'self' https://www.google.com https://www.gstatic.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https://www.gstatic.com;
      media-src 'self';
      connect-src 'self' https://api.emailjs.com;
      frame-src https://www.google.com;
      worker-src 'self';
      manifest-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,300;1,6..12,300&display=swap"
    rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
    rel="stylesheet">

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="David Huson Flamenco Guitarist & Producer" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="/manifest.json" />
  <title>David Huson</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
